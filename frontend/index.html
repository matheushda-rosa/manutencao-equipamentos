<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar | Controle de Manutencao</title>

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="tela-login">
    <div class="card card-login">
      <div class="card-body p-4 p-sm-5">

        <div class="text-center mb-4">
          <div class="login-logo mb-3">MN</div>
          <h1 class="h4 mb-1">Controle de Manutencao</h1>
          <p class="text-secondary small mb-0">Acesse com suas credenciais corporativas</p>
        </div>

        <!-- Area de avisos (sessao expirada, erro de login, etc.) -->
        <div id="aviso" class="alert d-none" role="alert"></div>

        <form id="formLogin" novalidate>
          <div class="mb-3">
            <label for="email" class="form-label">E-mail</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-envelope"></i></span>
              <input type="email" class="form-control" id="email" name="email"
                     autocomplete="username" placeholder="seu.nome@empresa.com.br" required>
            </div>
            <div class="invalid-feedback d-block" id="erroEmail"></div>
          </div>

          <div class="mb-4">
            <label for="senha" class="form-label">Senha</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control" id="senha" name="senha"
                     autocomplete="current-password" placeholder="Sua senha" required>
              <button class="btn btn-outline-secondary" type="button" id="btnVerSenha"
                      aria-label="Mostrar ou ocultar a senha">
                <i class="bi bi-eye" id="iconeSenha"></i>
              </button>
            </div>
            <div class="invalid-feedback d-block" id="erroSenha"></div>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2" id="btnEntrar">
            <span class="spinner-border spinner-border-sm me-2 d-none" id="carregando"></span>
            Entrar
          </button>
        </form>

        <p class="text-secondary smaller text-center mt-4 mb-0">
          Nao consegue acessar? Procure o administrador do sistema.
        </p>

      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/login.js"></script>
</body>
</html>
