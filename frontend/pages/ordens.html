<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ordens de Servico | Controle de Manutencao</title>

  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <header id="cabecalho"></header>

  <main class="container-fluid px-lg-4 conteudo-pagina">
    <div id="titulo-pagina"></div>

    <div class="barra-filtros mb-3">
      <div class="row g-2 align-items-end">
        <div class="col-12 col-md-5 col-xl-4">
          <label for="busca" class="form-label small text-secondary mb-1">Pesquisar</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input type="search" class="form-control" id="busca"
                   placeholder="Descricao, equipamento ou patrimonio">
          </div>
        </div>

        <div class="col-6 col-md-3 col-xl-2">
          <label for="filtroStatus" class="form-label small text-secondary mb-1">Status</label>
          <select class="form-select" id="filtroStatus">
            <option value="">Todos</option>
            <option value="ABERTA">Aberta</option>
            <option value="EM_ANDAMENTO">Em andamento</option>
            <option value="CONCLUIDA">Concluida</option>
            <option value="CANCELADA">Cancelada</option>
          </select>
        </div>

        <div class="col-6 col-md-2 col-xl-2">
          <label for="filtroTipo" class="form-label small text-secondary mb-1">Tipo</label>
          <select class="form-select" id="filtroTipo">
            <option value="">Todos</option>
            <option value="PREVENTIVA">Preventiva</option>
            <option value="CORRETIVA">Corretiva</option>
          </select>
        </div>

        <div class="col-6 col-md-3 col-xl-2">
          <label for="filtroPrioridade" class="form-label small text-secondary mb-1">
            Prioridade
          </label>
          <select class="form-select" id="filtroPrioridade">
            <option value="">Todas</option>
            <option value="URGENTE">Urgente</option>
            <option value="ALTA">Alta</option>
            <option value="MEDIA">Media</option>
            <option value="BAIXA">Baixa</option>
          </select>
        </div>

        <div class="col-6 col-md-3 col-xl-2">
          <label for="filtroTecnico" class="form-label small text-secondary mb-1">Tecnico</label>
          <select class="form-select" id="filtroTecnico"></select>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead>
            <tr>
              <th>OS</th>
              <th>Equipamento</th>
              <th>Tecnico</th>
              <th>Tipo</th>
              <th>Prioridade</th>
              <th>Abertura</th>
              <th>Status</th>
              <th class="coluna-acoes text-end">Acoes</th>
            </tr>
          </thead>
          <tbody id="tabela"></tbody>
        </table>
      </div>
      <div class="card-footer bg-white d-flex justify-content-between align-items-center">
        <span class="small text-secondary" id="resumo"></span>
        <nav id="paginacao"></nav>
      </div>
    </div>

    <!-- Modal: abrir ordem de servico -->
    <div class="modal fade" id="modalForm" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
          <form id="formulario" novalidate>
            <div class="modal-header">
              <h5 class="modal-title" id="modalTitulo">Abrir ordem de servico</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
              <input type="hidden" name="id">

              <div class="row g-3">
                <div class="col-12">
                  <label for="equipamentoId" class="form-label">
                    Equipamento <span class="text-danger">*</span>
                  </label>
                  <select class="form-select" id="equipamentoId" name="equipamentoId" required></select>
                  <div class="form-text">
                    Equipamentos inativos nao aparecem na lista.
                  </div>
                </div>

                <div class="col-12 col-sm-6">
                  <label for="tecnicoId" class="form-label">
                    Tecnico responsavel <span class="text-danger">*</span>
                  </label>
                  <select class="form-select" id="tecnicoId" name="tecnicoId" required></select>
                </div>

                <div class="col-6 col-sm-3">
                  <label for="tipo" class="form-label">Tipo <span class="text-danger">*</span></label>
                  <select class="form-select" id="tipo" name="tipo" required>
                    <option value="CORRETIVA">Corretiva</option>
                    <option value="PREVENTIVA">Preventiva</option>
                  </select>
                </div>

                <div class="col-6 col-sm-3">
                  <label for="prioridade" class="form-label">
                    Prioridade <span class="text-danger">*</span>
                  </label>
                  <select class="form-select" id="prioridade" name="prioridade" required>
                    <option value="BAIXA">Baixa</option>
                    <option value="MEDIA" selected>Media</option>
                    <option value="ALTA">Alta</option>
                    <option value="URGENTE">Urgente</option>
                  </select>
                </div>

                <div class="col-12">
                  <label for="descricao" class="form-label">
                    Descricao do servico <span class="text-danger">*</span>
                  </label>
                  <textarea class="form-control" id="descricao" name="descricao" rows="4"
                            minlength="10" maxlength="1000" required
                            placeholder="Descreva o problema observado ou a manutencao planejada."></textarea>
                  <div class="form-text">Minimo de 10 caracteres.</div>
                </div>
              </div>
            </div>

            <div class="modal-footer">
              <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
                Cancelar
              </button>
              <button type="submit" class="btn btn-primary" id="btnSalvar">
                <span class="spinner-border spinner-border-sm me-2 d-none"></span>Salvar
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Modal: alterar status / concluir manutencao -->
    <div class="modal fade" id="modalStatus" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <form id="formularioStatus" novalidate>
            <div class="modal-header">
              <h5 class="modal-title">Alterar status</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
              <input type="hidden" name="id">

              <p class="text-secondary small" id="statusAtual"></p>

              <div class="mb-3">
                <label for="novoStatus" class="form-label">
                  Novo status <span class="text-danger">*</span>
                </label>
                <select class="form-select" id="novoStatus" name="status" required></select>
              </div>

              <!-- Campo exibido apenas quando o novo status e CONCLUIDA -->
              <div class="mb-0 d-none" id="campoSolucao">
                <label for="solucao" class="form-label">
                  Servico realizado <span class="text-danger">*</span>
                </label>
                <textarea class="form-control" id="solucao" name="solucao" rows="4"
                          maxlength="1000"
                          placeholder="Descreva o que foi feito para resolver."></textarea>
                <div class="form-text">
                  Registrado no historico do equipamento.
                </div>
              </div>
            </div>

            <div class="modal-footer">
              <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
                Cancelar
              </button>
              <button type="submit" class="btn btn-primary" id="btnSalvarStatus">
                <span class="spinner-border spinner-border-sm me-2 d-none"></span>Confirmar
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../js/ordens.js"></script>
</body>
</html>
