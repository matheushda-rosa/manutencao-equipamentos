<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tecnicos | Controle de Manutencao</title>

  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <header id="cabecalho"></header>

  <main class="container-fluid px-lg-4 conteudo-pagina">
    <div id="titulo-pagina"></div>

    <div class="barra-filtros mb-3">
      <div class="row g-2 align-items-end">
        <div class="col-12 col-md-6 col-lg-4">
          <label for="busca" class="form-label small text-secondary mb-1">Pesquisar</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input type="search" class="form-control" id="busca"
                   placeholder="Nome, e-mail ou especialidade">
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead>
            <tr>
              <th>Nome</th>
              <th>Especialidade</th>
              <th>Contato</th>
              <th class="text-center">Ordens</th>
              <th class="text-center">Situacao</th>
              <th class="coluna-acoes text-end">Acoes</th>
            </tr>
          </thead>
          <tbody id="tabela"></tbody>
        </table>
      </div>
      <div class="card-footer bg-white d-flex justify-content-between align-items-center">
        <span class="small text-secondary" id="resumo"></span>
        <nav id="paginacao"></nav>
      </div>
    </div>

    <div class="modal fade" id="modalForm" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <form id="formulario" novalidate>
            <div class="modal-header">
              <h5 class="modal-title" id="modalTitulo">Novo tecnico</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
              <input type="hidden" name="id">

              <div class="mb-3">
                <label for="nome" class="form-label">Nome <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="nome" name="nome" maxlength="120" required>
              </div>

              <div class="mb-3">
                <label for="especialidade" class="form-label">
                  Especialidade <span class="text-danger">*</span>
                </label>
                <input type="text" class="form-control" id="especialidade" name="especialidade"
                       placeholder="Ex.: Eletrica, Refrigeracao" maxlength="120" required>
              </div>

              <div class="mb-3">
                <label for="telefone" class="form-label">Telefone <span class="text-danger">*</span></label>
                <input type="tel" class="form-control" id="telefone" name="telefone"
                       placeholder="(49) 99999-9999" maxlength="20" required>
              </div>

              <div class="mb-3">
                <label for="email" class="form-label">E-mail <span class="text-danger">*</span></label>
                <input type="email" class="form-control" id="email" name="email"
                       maxlength="160" required>
              </div>

              <div class="form-check form-switch mb-0">
                <input class="form-check-input" type="checkbox" id="ativo" name="ativo" checked>
                <label class="form-check-label" for="ativo">
                  Tecnico ativo (pode receber ordens de servico)
                </label>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
                Cancelar
              </button>
              <button type="submit" class="btn btn-primary" id="btnSalvar">
                <span class="spinner-border spinner-border-sm me-2 d-none"></span>Salvar
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../js/tecnicos.js"></script>
</body>
</html>
