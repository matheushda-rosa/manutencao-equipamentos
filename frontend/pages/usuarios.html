<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Usuarios | Controle de Manutencao</title>

  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <header id="cabecalho"></header>

  <main class="container-fluid px-lg-4 conteudo-pagina">
    <div id="titulo-pagina"></div>

    <div class="alert alert-info d-flex gap-2">
      <i class="bi bi-info-circle flex-shrink-0 mt-1"></i>
      <div class="small">
        Os usuarios sao criados no <strong>Firebase Authentication</strong> (console do Firebase,
        em Authentication &gt; Users). No primeiro acesso, o sistema registra automaticamente o
        usuario aqui com o perfil <strong>TECNICO</strong>. Use esta tela para promover alguem a
        administrador.
      </div>
    </div>

    <div class="card">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead>
            <tr>
              <th>Nome</th>
              <th>E-mail</th>
              <th>Perfil</th>
              <th>Primeiro acesso</th>
              <th class="coluna-acoes text-end">Acoes</th>
            </tr>
          </thead>
          <tbody id="tabela"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../js/usuarios.js"></script>
</body>
</html>
