<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Locais | Controle de Manutencao</title>

  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <header id="cabecalho"></header>

  <main class="container-fluid px-lg-4 conteudo-pagina">
    <div id="titulo-pagina"></div>

    <div class="barra-filtros mb-3">
      <div class="row g-2 align-items-end">
        <div class="col-12 col-md-6 col-lg-4">
          <label for="busca" class="form-label small text-secondary mb-1">Pesquisar</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input type="search" class="form-control" id="busca" placeholder="Nome, bairro ou cidade">
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead>
            <tr>
              <th>Nome</th>
              <th>Endereco</th>
              <th>Cidade</th>
              <th class="text-center">Equipamentos</th>
              <th class="coluna-acoes text-end">Acoes</th>
            </tr>
          </thead>
          <tbody id="tabela"></tbody>
        </table>
      </div>
      <div class="card-footer bg-white d-flex justify-content-between align-items-center">
        <span class="small text-secondary" id="resumo"></span>
        <nav id="paginacao"></nav>
      </div>
    </div>

    <div class="modal fade" id="modalForm" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
          <form id="formulario" novalidate>
            <div class="modal-header">
              <h5 class="modal-title" id="modalTitulo">Novo local</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
              <input type="hidden" name="id">

              <div class="row g-3">
                <div class="col-12">
                  <label for="nome" class="form-label">
                    Identificacao do local <span class="text-danger">*</span>
                  </label>
                  <input type="text" class="form-control" id="nome" name="nome"
                         placeholder="Ex.: Galpao de Producao" maxlength="120" required>
                </div>

                <!-- ViaCEP: ao completar o CEP os campos abaixo sao preenchidos -->
                <div class="col-12 col-sm-4">
                  <label for="cep" class="form-label">CEP <span class="text-danger">*</span></label>
                  <input type="text" class="form-control" id="cep" name="cep"
                         placeholder="89801-000" inputmode="numeric" maxlength="9" required>
                  <div class="invalid-feedback">CEP nao encontrado.</div>
                  <div class="form-text">O endereco e preenchido automaticamente.</div>
                </div>

                <div class="col-12 col-sm-8">
                  <label for="logradouro" class="form-label">
                    Logradouro <span class="text-danger">*</span>
                  </label>
                  <input type="text" class="form-control" id="logradouro" name="logradouro"
                         maxlength="160" required>
                </div>

                <div class="col-6 col-sm-3">
                  <label for="numero" class="form-label">Numero</label>
                  <input type="text" class="form-control" id="numero" name="numero" maxlength="20">
                </div>

                <div class="col-6 col-sm-4">
                  <label for="complemento" class="form-label">Complemento</label>
                  <input type="text" class="form-control" id="complemento" name="complemento"
                         maxlength="80">
                </div>

                <div class="col-12 col-sm-5">
                  <label for="bairro" class="form-label">Bairro <span class="text-danger">*</span></label>
                  <input type="text" class="form-control" id="bairro" name="bairro"
                         maxlength="120" required>
                </div>

                <div class="col-8 col-sm-9">
                  <label for="cidade" class="form-label">Cidade <span class="text-danger">*</span></label>
                  <input type="text" class="form-control" id="cidade" name="cidade"
                         maxlength="120" required>
                </div>

                <div class="col-4 col-sm-3">
                  <label for="uf" class="form-label">UF <span class="text-danger">*</span></label>
                  <input type="text" class="form-control text-uppercase" id="uf" name="uf"
                         maxlength="2" required>
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
                Cancelar
              </button>
              <button type="submit" class="btn btn-primary" id="btnSalvar">
                <span class="spinner-border spinner-border-sm me-2 d-none"></span>Salvar
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../js/locais.js"></script>
</body>
</html>
